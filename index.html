<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Watchlist</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="page">
  <header class="header">
    <div>
      <h1>My Watchlist</h1>
      <p class="muted" id="title-count">0 titles in your library</p>
    </div>
    <div class="stats" id="stats"></div>
    <div class="header-actions">
      <button class="btn btn-ghost" id="export-btn" title="Download a backup of your library">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Export
      </button>
      <button class="btn btn-ghost" id="import-btn" title="Restore from a backup file">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 15V3m0 0l-4 4m4-4l4 4M5 21h14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Import
      </button>
      <input type="file" id="import-file" accept="application/json" hidden />
      <button class="btn btn-primary" id="open-add">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        Add title
      </button>
    </div>
  </header>

  <div class="filter-row" id="status-tabs"></div>
  <div class="filter-row filter-row-tags" id="tag-chips"></div>

  <div class="search-row">
    <div class="search-box">
      <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="text" id="search" placeholder="Search your library..." />
    </div>
    <select id="sort">
      <option value="updated">Recently updated</option>
      <option value="added">Recently added</option>
      <option value="name">Name (A-Z)</option>
      <option value="tmdb_score">Audience score</option>
      <option value="my_score">My score</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <p>Your library is empty. Add the first title you're watching.</p>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 id="modal-title">Add a title</h2>
      <button class="icon-btn" id="close-modal">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <form id="title-form">
      <div class="field tmdb-field">
        <label>Name *</label>
        <input type="text" id="f-name" required autocomplete="off" placeholder="e.g. The Fox's Love Refresher" />
        <div class="tmdb-results" id="tmdb-results" hidden></div>
        <p class="tmdb-hint" id="tmdb-hint" hidden>Fetching matches from TMDB…</p>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Type</label>
          <select id="f-type">
            <option value="SERIES">Series</option>
            <option value="MOVIE">Movie</option>
          </select>
        </div>
        <div class="field">
          <label>Status</label>
          <select id="f-status">
            <option value="PLAN_TO_WATCH">Plan to Watch</option>
            <option value="WATCHING">Watching</option>
            <option value="ON_HOLD">On Hold</option>
            <option value="COMPLETED">Completed</option>
            <option value="DROPPED">Dropped</option>
          </select>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Year</label>
          <input type="number" id="f-year" min="1900" max="2100" placeholder="2024" />
        </div>
        <div class="field">
          <label>Your rating (0–10)</label>
          <input type="number" id="f-my-score" min="0" max="10" step="0.5" placeholder="e.g. 8.5" />
        </div>
      </div>
      <input type="hidden" id="f-tmdb-score" />

      <div class="field">
        <label>Poster image URL</label>
        <input type="text" id="f-poster" placeholder="https://..." />
      </div>

      <div class="field">
        <label>Where to watch (link)</label>
        <input type="text" id="f-watch" placeholder="https://netflix.com/..." />
      </div>

      <div class="field">
        <label>Genres / tags (comma separated)</label>
        <input type="text" id="f-tags" placeholder="Fantasy, Romance, Game" />
      </div>

      <div class="field">
        <label>Collection / franchise (optional)</label>
        <input type="text" id="f-collection" placeholder="e.g. Avatar — groups related titles together" />
      </div>

      <div class="field-row field-row-4" id="season-fields">
        <div class="field">
          <label>Season</label>
          <input type="number" id="f-season" min="0" value="1" />
        </div>
        <div class="field">
          <label>Episode</label>
          <input type="number" id="f-episode" min="0" value="0" />
        </div>
        <div class="field">
          <label>Total seasons</label>
          <input type="number" id="f-total-seasons" min="0" />
        </div>
        <div class="field">
          <label>Total episodes</label>
          <input type="number" id="f-total-episodes" min="0" />
        </div>
      </div>

      <div class="field">
        <label>Notes</label>
        <textarea id="f-notes" rows="2"></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-link-danger" id="delete-title" hidden>
          <svg viewBox="0 0 24 24" width="15" height="15"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Delete
        </button>
        <button type="submit" class="btn btn-primary" id="submit-title">Add title</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="collection-backdrop" hidden>
  <div class="modal" id="collection-modal">
    <div class="modal-header">
      <div>
        <h2 id="collection-modal-title">Collection</h2>
        <p class="muted" id="collection-modal-subtitle"></p>
      </div>
      <button class="icon-btn" id="close-collection-modal">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <p class="collection-hint">Drag to reorder — the first one becomes the cover.</p>
    <div class="collection-list" id="collection-list"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
